# Configuración de hypridle (~/.config/hypr/hypridle.conf)
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                             # evita iniciar múltiples instancias de hyprlock
    before_sleep_cmd = loginctl lock-session                          # bloquea antes de suspender o cerrar la tapa
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # enciende la pantalla al despertar
}

# Atenuar brillo tras 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Bloquear pantalla tras 5 min de inactividad
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Apagar pantalla (DPMS) tras 5.5 min de inactividad
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspender el equipo tras 30 min de inactividad
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
